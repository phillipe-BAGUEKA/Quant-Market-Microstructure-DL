[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cfm-market-microstructure"
version = "0.1.0"
description = "Modular tooling for the CFM market microstructure challenge"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "Phillipe BAGUEKA" },
]
dependencies = [
  "numpy>=2.5,<3.0",
  "pandas>=2.2,<3.1",
  "scikit-learn>=1.5,<2.0",
  "threadpoolctl>=3.5,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["cfm_challenge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
